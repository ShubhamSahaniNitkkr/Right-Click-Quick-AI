<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Right Click Quick AI</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #f9fafb;
        margin: 0;
        padding: 16px;
        width: 330px;
        color: #111827;
      }

      h3 {
        margin-bottom: 12px;
        font-size: 18px;
        color: #1f2937;
      }

      label {
        font-weight: 600;
        margin-top: 12px;
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
        color: #374151;
      }

      input[type="password"],
      input[type="text"],
      textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
        transition: border-color 0.3s;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #2563eb;
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: #2563eb;
        color: white;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: #1d4ed8;
      }

      .note {
        font-size: 12px;
        color: #6b7280;
        margin-top: -8px;
        margin-bottom: 16px;
      }

      .note a {
        color: #2563eb;
        text-decoration: none;
      }

      .note a:hover {
        text-decoration: underline;
      }

      #header-bar {
        display: flex;
        align-items: center;
        color: #02a9f4;
        border-bottom: 1px solid gainsboro;
        padding-bottom: 5px;
        font-size: 18px;
      }

      #header-image {
        height: 30px;
      }
    </style>
  </head>
  <body>
    <div id="header-bar">
      <img id="header-image" src="./icons/icon128.png" />
      <strong>Right Click Quick AI</strong>
    </div>
    <label for="apiKey">Paste your Gemini or Open API (Chat GPT) Key:</label>
    <input
      id="apiKey"
      type="password"
      placeholder="Paste your Key here..."
    />
    <div class="note">
      Don't have one?
      <br />
      <a href="https://aistudio.google.com/apikey" target="_blank"
        >Get your new Gemini API key here</a
      >
      <br />
      <a href="https://platform.openai.com/api-keys" target="_blank"
        >Get your new Open API (Chat GPT) API key here</a
      >
    </div>

    <label for="prompt">Default Prompt:</label>
    <input id="prompt" type="text" placeholder="e.g., Improve this:" />

    <button id="saveBtn">Save Settings</button>

    <script src="popup.js"></script>
  </body>
</html>
